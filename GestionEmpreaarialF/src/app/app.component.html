
<ng-container *ngIf="!isLoggedIn; else mainLayout">
  <!-- Login antes de hacer nada -->
  <div class="login">
    <app-login (loginSuccess)="onLoginSuccess()"></app-login>
  </div>
</ng-container>

<ng-template #mainLayout>
  <!-- Layout principal sólo tras login -->
  <div class="layout">
    <aside class="sidebar">
      <app-navegador></app-navegador>
    </aside>
    <section class="content">
      <!-- ÚNICO router-outlet para toda la app -->
      <router-outlet></router-outlet>
    </section>
  </div>
</ng-template>
